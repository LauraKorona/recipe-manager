<main>
  <h1>Recipe Manager</h1>

  <section>
    <h2>Add Recipe</h2>

    <form>
      <label>
        Name:
        <input
          type="text"
          name="name"
          [(ngModel)]="newRecipe.name"
          required>
      </label>

      <label>
        Description:
        <input
          type="text"
          name="description"
          [(ngModel)]="newRecipe.description">
      </label>

      <label>
        Preparation time:
        <input
          type="number"
          name="preparationTime"
          [(ngModel)]="newRecipe.preparationTime">
      </label>

      <label>
        Difficulty:
        <select
          name="difficulty"
          [(ngModel)]="newRecipe.difficulty">
          <option value="EASY">Easy</option>
          <option value="MEDIUM">Medium</option>
          <option value="HARD">Hard</option>
        </select>
      </label>

      <label>
        Category:
        <input
          type="text"
          name="category"
          [(ngModel)]="newRecipe.category">
      </label>

      <button
        type="button"
        (click)="addRecipe()">
        Add Recipe
      </button>
      
    </form>
  </section>

  <section>
    <h2>Recipes</h2>

    @for (recipe of recipes; track recipe.id) {
      <article>
        <h3>{{ recipe.name }}</h3>

        <p>{{ recipe.description }}</p>
        <p>Preparation time: {{ recipe.preparationTime }} minutes</p>
        <p>Difficulty: {{ recipe.difficulty }}</p>
        <p>Category: {{ recipe.category }}</p>

        <button
          type="button"
          (click)="deleteRecipe(recipe.id)">
          Delete
        </button>
      </article>
    } @empty {
      <p>No recipes yet.</p>
    }
  </section>
</main>
